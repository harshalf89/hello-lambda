# Branch-per-environment deploy.
#
#   push to develop  ->  deploys hello-lambda-dev      (auto)
#   push to staging  ->  deploys hello-lambda-staging  (auto)
#   push to main     ->  deploys hello-lambda-prod     (waits for approval,
#                                                       because the "prod"
#                                                       GitHub Environment
#                                                       has a required reviewer)
#
# "Promoting" code = opening a PR from one branch to the next and merging it.

name: Deploy to Lambda

on:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Ties this run to a GitHub "Environment". Protection rules on that
    # environment (e.g. required reviewer on prod) gate the job automatically.
    environment: ${{ fromJSON('{"develop":"dev","staging":"staging","main":"prod"}')[github.ref_name] }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Map the branch that was pushed to the Lambda function to update.
      - name: Resolve target function
        id: t
        run: |
          case "${{ github.ref_name }}" in
            develop) echo "fn=hello-lambda-dev"     >> "$GITHUB_OUTPUT" ;;
            staging) echo "fn=hello-lambda-staging" >> "$GITHUB_OUTPUT" ;;
            main)    echo "fn=hello-lambda-prod"    >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported branch: ${{ github.ref_name }}"; exit 1 ;;
          esac
          echo "Target: $(cat "$GITHUB_OUTPUT")"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build zip
        run: zip -r function.zip lambda_function.py

      - name: Deploy to ${{ steps.t.outputs.fn }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ steps.t.outputs.fn }}" \
            --zip-file fileb://function.zip \
            --publish

      - name: Wait for update to finish
        run: aws lambda wait function-updated --function-name "${{ steps.t.outputs.fn }}"

      - name: Smoke test
        run: |
          aws lambda invoke \
            --function-name "${{ steps.t.outputs.fn }}" \
            --payload '{"name":"github-actions"}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          echo "Lambda responded:"
          cat response.json
