# What: deploy hello-lambda to AWS on every push to main.
# How:  zip the code, then call AWS to replace the function's code.

name: Deploy to Lambda

# When this workflow runs
on:
  push:
    branches: [main]
  workflow_dispatch:      # also lets you run it manually from the Actions tab

# Sensible defaults
env:
  AWS_REGION: us-east-1
  FUNCTION_NAME: hello-lambda

jobs:
  deploy:
    runs-on: ubuntu-latest      # GitHub gives us a fresh Linux VM

    steps:
      # 1. Get the repo's code onto the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using the repo secrets (the deployer user's keys)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Package the function code into a zip
      - name: Build zip
        run: zip -r function.zip lambda_function.py

      # 4. Upload the new code to the existing Lambda function
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip \
            --publish

      # 5. Wait until AWS finishes applying the update
      - name: Wait for update to finish
        run: aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      # 6. Smoke test: invoke the function and print what it returned
      - name: Smoke test
        run: |
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload '{"name":"github-actions"}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          echo "Lambda responded:"
          cat response.json
